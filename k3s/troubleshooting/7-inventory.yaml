# Broken app 7
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: troubleshooting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: localhost:5000/hello-web:1.0
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: troubleshooting
spec:
  selector:
    app: inventory
  ports:
    - port: 80
      targetPort: 80
