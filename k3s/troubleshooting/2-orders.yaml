# Broken app 2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: troubleshooting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: localhost:5000/visit-counter:1.0
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
