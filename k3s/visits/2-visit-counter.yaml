# The visit counter from the Docker half day (compose-traefik), as Kubernetes resources
apiVersion: v1
kind: Secret
metadata:
  name: visit-counter
  namespace: visits
stringData:
  ConnectionStrings__Visits: Host=postgres;Username=postgres;Password=workshop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visit-counter
  namespace: visits
spec:
  replicas: 3
  selector:
    matchLabels:
      app: visit-counter
  template:
    metadata:
      labels:
        app: visit-counter
    spec:
      securityContext:            # docker run --read-only --cap-drop ALL --security-opt no-new-privileges
        runAsNonRoot: true        # refuse to start an image that runs as root
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: visit-counter
          image: localhost:5000/visit-counter:1.0
          envFrom:
            - secretRef:
                name: visit-counter
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:         # ready for traffic?
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
          livenessProbe:          # still alive? If not, restart the container
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          lifecycle:
            preStop:              # keep serving while traffic is redirected to the other Pods
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: visit-counter
  namespace: visits
spec:
  selector:
    app: visit-counter
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: visit-counter
  namespace: visits
spec:
  rules:
    - host: visits.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: visit-counter
                port:
                  number: 80
